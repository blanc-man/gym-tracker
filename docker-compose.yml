services:
  gym-tracker:
    build:
      context: .
      args:
        VITE_BASE_PATH: /
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "3003:80"
    networks:
      - default
      - roster_net

networks:
  roster_net:
    external: true
    name: bhrcg_roster_net
